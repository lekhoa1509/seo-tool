name: Build macOS App

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        run: npm ci --omit=dev
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Build macOS app (.pkg + .dmg)
        # Only publish a GitHub Release when triggered by a version tag push;
        # a manual "Run workflow" just builds artifacts to download.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            npx electron-builder --mac pkg dmg --publish always
          else
            npx electron-builder --mac pkg dmg --publish never
          fi
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seo-tool-macos
          path: |
            desktop/dist/*.pkg
            desktop/dist/*.dmg
          if-no-files-found: error
